<IfModule mod_status.c>
        # Allow server status reports generated by mod_status,
        # with the URL of http://servername/server-status

        <Location /server-status>
                SetHandler server-status
                # Rendered at container start by docker-entrypoint-maint.sh from
                # STATUS_ALLOWED_IPS, which defaults to 127.0.0.1 - the same
                # default the live image uses, so a build that lands in an
                # environment nobody configured is localhost-only rather than
                # open to whatever 10.0.1.0/24 happens to mean there.
                # Set it per environment, e.g. STATUS_ALLOWED_IPS=10.0.1.0/24.
                Require ip ${STATUS_ALLOWED_IPS}
        </Location>

        # Keep track of extended status information for each request
        ExtendedStatus On

        # Determine if mod_status displays the first 63 characters of a request or
        # the last 63, assuming the request itself is greater than 63 chars.
        # Default: Off
        #SeeRequestTail On


        <IfModule mod_proxy.c>
                # Show Proxy LoadBalancer status in mod_status
                ProxyStatus On
        </IfModule>


</IfModule>
